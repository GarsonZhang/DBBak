<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#143c35">
  <meta name="description" content="DBBak 数据库备份管理阶段二服务，支持 MySQL 逻辑全量与 Percona XtraBackup 物理全量、PostgreSQL 整实例物理全量、调度、校验与清理。">
  <title>DBBak · 数据库备份管理</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app-extra.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#overview" data-nav="overview" aria-label="DBBak 首页"><span class="brand-mark"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 7 16 2l11 5v12c0 5-11 11-11 11S5 24 5 19Z" stroke="currentColor" stroke-width="2"/><path d="m10 11 6 11 6-11M11 15h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>DBBak</span><small>BACKUP MANAGER</small></a>
    <div class="workspace"><span class="workspace-icon" data-icon="database"></span><div><strong>数据管理工作台</strong><span>默认工作空间</span></div><span data-icon="chevron" class="workspace-chevron"></span></div>
    <div class="nav-caption">工作空间</div>
    <nav aria-label="主要导航">
      <button class="nav-item active" data-nav="overview"><span data-icon="grid"></span><span>备份概览</span></button>
      <button class="nav-item" data-nav="tasks"><span data-icon="shield"></span><span>备份任务</span><span class="nav-count" id="nav-task-count">6</span></button>
      <button class="nav-item" data-nav="databases"><span data-icon="database"></span><span>数据库</span></button>
      <button class="nav-item" data-nav="storage"><span data-icon="folder"></span><span>存储位置</span></button>
      <div class="nav-caption second">运维管理</div>
      <button class="nav-item" data-nav="logs"><span data-icon="log"></span><span>执行日志</span></button>
      <button class="nav-item" data-nav="cleanup"><span data-icon="trash"></span><span>清理策略</span></button>
      <button class="nav-item" data-nav="deployment"><span data-icon="harddrive"></span><span>部署与执行器</span></button>
      <button class="nav-item" data-nav="settings"><span data-icon="settings"></span><span>系统设置</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="protection-note"><span data-icon="shield"></span><div><strong>为每一个恢复点护航</strong><p>备份链保护 · 安全保留策略</p></div><span class="protection-light"></span></div>
      <div class="sidebar-footer"><span class="status-dot"></span> 阶段二 <span>v0.2.0</span></div>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar">
      <button class="btn btn-icon menu-toggle" id="menu-toggle" aria-label="展开导航"><span data-icon="grid"></span></button>
      <div class="breadcrumb"><span>工作空间</span><span class="breadcrumb-separator">/</span><strong id="breadcrumb">备份概览</strong></div>
      <div class="topbar-right">
        <label class="global-search"><span data-icon="search"></span><input id="global-search" type="search" placeholder="搜索任务、数据库…" aria-label="搜索任务、数据库"><kbd>/</kbd></label>
        <span class="demo-label"><span></span>真实服务</span>
        <span class="topbar-divider"></span>
        <button class="notification-btn" data-nav="logs" aria-label="查看执行通知"><span data-icon="bell"></span><i></i></button>
        <div class="avatar" aria-label="管理员">A</div>
      </div>
    </header>
    <main id="main"></main>
    <footer class="app-footer"><span><span class="status-dot"></span> 真实 API · SQLite 持久化</span><span>DBBAK BACKUP MANAGER <span class="footer-separator">/</span> Asia/Shanghai</span></footer>
  </div>
  <dialog id="modal" aria-label="配置面板"></dialog>
  <!-- popover 会把提示条放进浏览器的顶层（top layer），与 <dialog> 处于同一层，
       否则弹窗打开时 z-index 再大也会被 dialog 的遮罩压住。 -->
  <div id="toast" popover="manual" role="status" aria-live="polite"></div>
  <script>
    const iconPaths={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8.5 11.5 2.5 2.5 4.5-5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 9h18"/>',chart:'<path d="M4 3v17h17M8 15v-4m5 4V6m5 9v-6"/>',settings:'<path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3h3l2 3h3l1-3 3-1 2-3-2-2 1-3-2-3h-3l-2-3Z"/><circle cx="12" cy="12" r="3"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',plus:'<path d="M12 5v14M5 12h14"/>',chevron:'<path d="m8 10 4 4 4-4"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',play:'<path d="m8 4 12 8-12 8Z"/>',pause:'<path d="M8 5v14M16 5v14"/>',check:'<path d="m5 12 4 4L19 6"/>',x:'<path d="m6 6 12 12M6 18 18 6"/>',refresh:'<path d="M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5M4 16a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',file:'<path d="M14 2H5v20h14V7ZM14 2v5h5M8 12h8M8 16h5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',harddrive:'<rect x="3" y="13" width="18" height="7" rx="2"/><path d="m3 14 3-9h12l3 9M7 17h.01M11 17h.01"/>',external:'<path d="M14 3h7v7M10 14 21 3M10 3H3v18h18v-7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2"/>',log:'<path d="M5 3h14v18H5ZM9 7h6M9 11h6M9 15h4"/>',filter:'<path d="M4 5h16M7 12h10M10 19h4"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/>'};
    window.icon=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name]||iconPaths.database}</svg>`;
    document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
    document.getElementById('menu-toggle').onclick=()=>document.body.classList.toggle('nav-open');
    document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>document.body.classList.remove('nav-open')));
    document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('global-search').focus();}});
  </script>
  <script src="app.js"></script>
</body>
</html>
