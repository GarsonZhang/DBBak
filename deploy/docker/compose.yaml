# 正式单机示例。构建产物不等于运行验收：必须在目标 Linux 主机实际启动，
# 验证 readiness、重启持久化、备份/恢复和所需数据库客户端后才能验收。
name: dbbak-production

services:
  dbbak:
    image: 192.168.10.221/library/dbbak:latest
    restart: unless-stopped
    environment:
      DBBAK_ADDR: 0.0.0.0:8080
      DBBAK_DATA_DIR: /var/lib/dbbak
      DBBAK_DATABASE: /var/lib/dbbak/dbbak.db
      DBBAK_BACKUP_ROOT: /backups
      DBBAK_MASTER_KEY_FILE: /etc/dbbak-key/master.key
      DBBAK_SESSION_TTL: 12h
      DBBAK_SCHEDULER_INTERVAL: 2s
      DBBAK_BACKUP_TIMEOUT: 30m
      # 首次启动自动建号：仅在元数据库还没有任何用户时生效，已有账号则完全忽略，
      # 因此长期保留该变量也不会重置密码。建议从宿主机环境或 .env 注入，不要硬编码。
      # 未设置时容器照常启动，但无法登录，需要另外执行 init-admin。
      DBBAK_ADMIN_USERNAME: ${DBBAK_ADMIN_USERNAME:-admin}
      DBBAK_ADMIN_PASSWORD: ${DBBAK_ADMIN_PASSWORD:-}
    ports:
      - "18110:8080"
    volumes:
      # SQLite 与 -wal/-shm 必须位于同一数据卷；主密钥使用独立卷并单独异地备份。
      - dbbak-data:/var/lib/dbbak
      - dbbak-backups:/backups
      - dbbak-master-key:/etc/dbbak-key
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    stop_grace_period: 30s

volumes:
  dbbak-data:
    name: dbbak-production-data
  dbbak-backups:
    name: dbbak-production-backups
  dbbak-master-key:
    name: dbbak-production-master-key
