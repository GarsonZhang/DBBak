services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    command: ["mysqld", "--skip-log-bin", "--bind-address=0.0.0.0"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DBBAK_TEST_ROOT_PASSWORD:?请设置隔离测试 root 密码}
      MYSQL_DATABASE: dbbak_source
      MYSQL_USER: dbbak_test
      MYSQL_PASSWORD: ${DBBAK_TEST_MYSQL_PASSWORD:?请设置隔离测试账号密码}
    ports:
      - "127.0.0.1:33306:3306"
    volumes:
      - dbbak-phase1-mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  dbbak-phase1-mysql-data:
